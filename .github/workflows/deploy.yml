name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
        run: |
          # 第一步：安装服务器依赖
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP << 'DEPS_EOF'
            # 安装git
            if ! command -v git &> /dev/null; then
              echo "安装git..."
              yum install -y git || apt-get update && apt-get install -y git
            fi

            # 安装docker
            if ! command -v docker &> /dev/null; then
              echo "安装docker..."
              curl -fsSL https://get.docker.com | sh
              systemctl start docker
              systemctl enable docker
            fi

            # 安装docker-compose
            if ! command -v docker-compose &> /dev/null; then
              echo "安装docker-compose..."
              curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              chmod +x /usr/local/bin/docker-compose
            fi

            echo "依赖检查完成"
            git --version
            docker --version
            docker-compose --version
          DEPS_EOF

          # 第二步：部署应用（使用环境变量传递secrets）
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP \
            "DEEPSEEK_API_KEY='$DEEPSEEK_API_KEY' DEEPSEEK_BASE_URL='$DEEPSEEK_BASE_URL' bash -s" << 'DEPLOY_EOF'
            cd /root

            # 克隆或更新项目
            if [ ! -d "paper-ai-detection-system" ]; then
              git clone https://github.com/Infinity-light/paper-ai-detection-system.git
            else
              cd paper-ai-detection-system
              git pull origin master
              cd /root
            fi

            cd paper-ai-detection-system

            # 创建.env文件
            cat > .env << EOF
          DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
          DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
          DATABASE_URL=postgresql://user:paper_detect_2026@postgres:5432/paper_detection
          REDIS_URL=redis://redis:6379/0
          UPLOAD_DIR=/data/uploads
          RESULT_DIR=/data/results
          HOST=0.0.0.0
          PORT=8000
          EOF

            # 创建数据目录
            mkdir -p data/uploads data/results

            # 停止旧容器
            docker-compose down 2>/dev/null || true

            # 构建并启动新容器
            docker-compose up -d --build

            # 等待服务启动
            echo "等待服务启动..."
            sleep 20

            # 初始化数据库
            docker-compose exec -T backend python -c "from app.database import init_db; init_db()" 2>/dev/null || true

            # 检查服务状态
            echo "服务状态："
            docker-compose ps
          DEPLOY_EOF

      - name: Health check
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          sleep 10
          curl -sf http://$SERVER_IP:8000/docs > /dev/null && echo "健康检查通过！" || echo "健康检查失败"
