name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Setup server dependencies
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP << 'DEPS_EOF'
            set -e

            # 安装docker（使用阿里云镜像源）
            if ! command -v docker &> /dev/null; then
              echo ">>> 安装docker..."
              yum install -y yum-utils
              yum-config-manager --add-repo https://mirrors.aliyun.com/docker-ce/linux/centos/docker-ce.repo
              sed -i 's+download.docker.com+mirrors.aliyun.com/docker-ce+' /etc/yum.repos.d/docker-ce.repo
              yum makecache
              yum install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
              systemctl start docker
              systemctl enable docker
            fi
            echo "docker: $(docker --version)"

            # 配置Docker镜像加速器
            mkdir -p /etc/docker
            cat > /etc/docker/daemon.json << 'DAEMON_EOF'
            {
              "registry-mirrors": [
                "https://mirror.ccs.tencentyun.com",
                "https://docker.m.daocloud.io"
              ]
            }
          DAEMON_EOF
            systemctl daemon-reload
            systemctl restart docker

            echo ">>> 依赖就绪"
          DEPS_EOF

      - name: Package and upload code
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          # 打包代码（排除node_modules和.git）
          tar czf /tmp/app.tar.gz --exclude='node_modules' --exclude='.git' --exclude='__pycache__' .

          # 创建远程目录
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "mkdir -p /root/paper-ai-detection-system"

          # 上传代码包
          sshpass -p "$SERVER_PASSWORD" scp -o StrictHostKeyChecking=no /tmp/app.tar.gz $SERVER_USER@$SERVER_IP:/root/paper-ai-detection-system/app.tar.gz

          # 解压
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP << 'EXTRACT_EOF'
            cd /root/paper-ai-detection-system
            tar xzf app.tar.gz
            rm -f app.tar.gz
            echo ">>> 代码上传完成"
          EXTRACT_EOF

      - name: Deploy application
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
        run: |
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP \
            "DEEPSEEK_API_KEY='$DEEPSEEK_API_KEY' DEEPSEEK_BASE_URL='$DEEPSEEK_BASE_URL' bash -s" << 'DEPLOY_EOF'
            set -e
            cd /root/paper-ai-detection-system

            # 创建.env文件
            cat > .env << EOF
          DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
          DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
          DATABASE_URL=postgresql://user:paper_detect_2026@postgres:5432/paper_detection
          REDIS_URL=redis://redis:6379/0
          UPLOAD_DIR=/data/uploads
          RESULT_DIR=/data/results
          HOST=0.0.0.0
          PORT=8000
          EOF

            # 创建数据目录
            mkdir -p data/uploads data/results

            # 使用docker compose
            COMPOSE_CMD="docker compose"
            if ! docker compose version &> /dev/null; then
              COMPOSE_CMD="docker-compose"
            fi

            # 停止旧容器
            echo ">>> 停止旧容器..."
            $COMPOSE_CMD down 2>/dev/null || true

            # 构建并启动新容器
            echo ">>> 构建并启动容器..."
            $COMPOSE_CMD up -d --build

            # 等待服务启动
            echo ">>> 等待服务启动..."
            sleep 20

            # 初始化数据库
            echo ">>> 初始化数据库..."
            $COMPOSE_CMD exec -T backend python -c "from app.database import init_db; init_db()" 2>/dev/null || true

            # 检查服务状态
            echo ">>> 服务状态："
            $COMPOSE_CMD ps
          DEPLOY_EOF

      - name: Health check
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          sleep 10
          curl -sf http://$SERVER_IP:8000/docs > /dev/null && echo "健康检查通过！" || echo "健康检查失败（服务可能仍在启动中）"
