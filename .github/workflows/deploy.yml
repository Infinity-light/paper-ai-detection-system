name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Setup server dependencies
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP << 'DEPS_EOF'
            set -e

            # 安装git
            if ! command -v git &> /dev/null; then
              echo ">>> 安装git..."
              yum install -y git
            fi
            echo "git: $(git --version)"

            # 安装docker（使用阿里云镜像源）
            if ! command -v docker &> /dev/null; then
              echo ">>> 安装docker（阿里云镜像源）..."
              yum install -y yum-utils
              yum-config-manager --add-repo https://mirrors.aliyun.com/docker-ce/linux/centos/docker-ce.repo
              sed -i 's+download.docker.com+mirrors.aliyun.com/docker-ce+' /etc/yum.repos.d/docker-ce.repo
              yum makecache fast
              yum install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
              systemctl start docker
              systemctl enable docker
            fi
            echo "docker: $(docker --version)"

            # 配置Docker镜像加速器（阿里云）
            mkdir -p /etc/docker
            cat > /etc/docker/daemon.json << 'DAEMON_EOF'
            {
              "registry-mirrors": [
                "https://mirror.ccs.tencentyun.com",
                "https://docker.m.daocloud.io"
              ]
            }
          DAEMON_EOF
            systemctl daemon-reload
            systemctl restart docker

            # 检查docker compose（新版docker自带compose插件）
            if docker compose version &> /dev/null; then
              echo "docker compose: $(docker compose version)"
            elif command -v docker-compose &> /dev/null; then
              echo "docker-compose: $(docker-compose --version)"
            else
              echo ">>> 安装docker-compose..."
              curl -L "https://ghfast.top/https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              chmod +x /usr/local/bin/docker-compose
              echo "docker-compose: $(docker-compose --version)"
            fi

            echo ">>> 依赖安装完成"
          DEPS_EOF

      - name: Deploy application
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
        run: |
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP \
            "DEEPSEEK_API_KEY='$DEEPSEEK_API_KEY' DEEPSEEK_BASE_URL='$DEEPSEEK_BASE_URL' bash -s" << 'DEPLOY_EOF'
            set -e
            cd /root

            # 克隆或更新项目
            if [ ! -d "paper-ai-detection-system" ]; then
              echo ">>> 克隆项目..."
              git clone https://github.com/Infinity-light/paper-ai-detection-system.git
            else
              echo ">>> 更新项目..."
              cd paper-ai-detection-system
              git pull origin master
              cd /root
            fi

            cd paper-ai-detection-system

            # 创建.env文件
            cat > .env << EOF
          DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
          DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
          DATABASE_URL=postgresql://user:paper_detect_2026@postgres:5432/paper_detection
          REDIS_URL=redis://redis:6379/0
          UPLOAD_DIR=/data/uploads
          RESULT_DIR=/data/results
          HOST=0.0.0.0
          PORT=8000
          EOF

            # 创建数据目录
            mkdir -p data/uploads data/results

            # 使用docker compose（优先新版插件，降级到docker-compose）
            COMPOSE_CMD="docker compose"
            if ! docker compose version &> /dev/null; then
              COMPOSE_CMD="docker-compose"
            fi

            # 停止旧容器
            echo ">>> 停止旧容器..."
            $COMPOSE_CMD down 2>/dev/null || true

            # 构建并启动新容器
            echo ">>> 构建并启动容器..."
            $COMPOSE_CMD up -d --build

            # 等待服务启动
            echo ">>> 等待服务启动..."
            sleep 20

            # 初始化数据库
            echo ">>> 初始化数据库..."
            $COMPOSE_CMD exec -T backend python -c "from app.database import init_db; init_db()" 2>/dev/null || true

            # 检查服务状态
            echo ">>> 服务状态："
            $COMPOSE_CMD ps
          DEPLOY_EOF

      - name: Health check
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          sleep 10
          curl -sf http://$SERVER_IP:8000/docs > /dev/null && echo "健康检查通过！" || echo "健康检查失败（服务可能仍在启动中）"
